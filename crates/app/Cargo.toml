[package]
name = "securewire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Desktop SSH workstation: a terminal with live server panels over one SSH connection."
homepage = "https://github.com/ismailian/SecureWire"
repository = "https://github.com/ismailian/SecureWire"

[[bin]]
name = "securewire"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
sw-core.workspace = true
sw-ssh.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
regex-lite.workspace = true
sw-term.workspace = true
secrecy.workspace = true
directories.workspace = true
parking_lot.workspace = true

# `cargo deb -p securewire` (release workflow).
[package.metadata.deb]
name = "securewire"
maintainer = "SecureWire developers"
section = "net"
extended-description = "Desktop SSH workstation: an interactive terminal with live panels (resources, services, firewall, security, logs) over one SSH connection per host. Nothing is installed on the servers."
assets = [
    ["target/release/securewire", "usr/bin/", "755"],
    ["../../packaging/securewire.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/securewire-256.png", "usr/share/icons/hicolor/256x256/apps/securewire.png", "644"],
    ["../../packaging/icons/securewire-128.png", "usr/share/icons/hicolor/128x128/apps/securewire.png", "644"],
    ["../../packaging/icons/securewire-64.png", "usr/share/icons/hicolor/64x64/apps/securewire.png", "644"],
    ["../../packaging/icons/securewire-32.png", "usr/share/icons/hicolor/32x32/apps/securewire.png", "644"],
    ["../../packaging/icons/securewire.svg", "usr/share/icons/hicolor/scalable/apps/securewire.svg", "644"],
]
